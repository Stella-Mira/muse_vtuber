# muse_vtuber -- DSH GUI "avatar" view (bundle patch)
#
# ASCII only on purpose: the Loader reads this at startup and this machine's
# console tooling mixes code pages (GBK vs UTF-8).
#
# This file is only the BASELINE. The authoritative config is
#   $DSH_HOME/mira_config/muse_vtuber/config.json
# which the settings page ("Settings - Avatar") writes and which wins from then on.
# Every default below is documented in README.md (config table).
#
# Split (2026-11-01): this plugin now only draws the avatar.
#   * speech (TTS / ASR / VAD) lives in mira_audio   -> /audio/api/*,  config mira_config/mira_audio
#   * camera / mic / virtual capture lives in mira_input -> /input/api/*, config mira_config/mira_input
#   * the Aliyun API key lives in mira_audio (creds/dashscope.json, mode 600)
# Old keys (camera/mic/tts/asr/vision/capture/events) may still sit in an existing
# config.json; they are left untouched but no longer read here (see README "migration").
#
# legacyNode: the old external "stella muse_vtuber node" bridge (v2 feature, not
# part of the task book). Kept as lib/legacy/node-bridge.js, not loaded unless
# enabled here; when enabling, put the whole old config under legacyNode.config.
- insert:
    - id: muse_vtuber
      name: muse_vtuber
      config:
        enabled: true
        live2d:
          modelsDir: ''
          model: ''
        legacyNode:
          enabled: false
